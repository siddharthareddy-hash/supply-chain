services:
  postgres:
    image: postgres:16
    container_name: sc_postgres
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d supply_chain"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
